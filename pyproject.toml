[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "limen"
version = "0.0.1"
description = "A Global Workspace model for studying conscious and unconscious processing."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Thomas" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.0",
]
ui = [
    "streamlit>=1.36",
]
analysis = [
    "pandas>=2.2",
    "matplotlib>=3.8",
    "jupyterlab>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[project.scripts]
limen = "limen.cli:main"
